method: generated
vocabulary:
  name: Supaglue Vocabulary
  description: >-
    Domain vocabulary for Supaglue, an open-source unified API platform for
    building CRM, HRIS, sales engagement, and other B2B SaaS integrations.
  version: '1.0'
  created: '2026-05-02'
  modified: '2026-05-02'
  tags:
    - Supaglue
    - CRM
    - Unified API
    - Integrations
    - Open Source

terms:
  - term: Customer
    definition: >-
      In Supaglue, a "customer" is one of your end users who connects their
      third-party provider account (e.g. their Salesforce org) to your product.
      Not a billing customer of Supaglue itself. Identified by a customer_id.
    category: Management

  - term: Connection
    definition: >-
      A link between a Supaglue customer and a specific third-party provider
      (e.g. "customer A's Salesforce connection"). Contains OAuth credentials
      and sync configuration. Created when the customer completes OAuth via
      a magic link.
    category: Management

  - term: Provider
    definition: >-
      A third-party SaaS application that Supaglue integrates with. Examples
      include Salesforce, HubSpot, Pipedrive (CRM), Outreach, Salesloft
      (Engagement), Zendesk, Linear (Ticketing), Greenhouse, Lever (ATS).
      Identified by a provider_name string.
    category: Management

  - term: Unified API
    definition: >-
      Supaglue's abstraction layer that normalizes data models and API
      interfaces across multiple providers. A single Supaglue API call can
      read from or write to any supported provider using a common schema.
      Unified APIs exist for CRM, Engagement, Enrichment, and Ticketing.
    category: Core

  - term: Passthrough API
    definition: >-
      An API mode that proxies requests directly to the underlying provider's
      native API using Supaglue-managed credentials. Used for provider-specific
      operations not covered by the Unified API.
    category: Core

  - term: Sync
    definition: >-
      A Supaglue background process that reads data from a provider and writes
      it to a configured destination (data warehouse or Supaglue cache).
      Syncs can be triggered manually or run on a schedule.
    category: Sync

  - term: Sync Config
    definition: >-
      Configuration that defines what objects to sync, the sync frequency,
      sync strategy (full refresh or incremental), and the destination for a
      customer connection.
    category: Sync

  - term: Destination
    definition: >-
      A data warehouse or database where Supaglue syncs provider data.
      Supported destinations: BigQuery, Snowflake, Redshift, Postgres.
    category: Sync

  - term: Magic Link
    definition: >-
      A time-limited URL generated by the Supaglue Management API that allows
      a customer to authenticate with a provider via OAuth without directly
      handling OAuth redirect flows in your application.
    category: Authentication

  - term: x-customer-id
    definition: >-
      An HTTP request header required by Supaglue's Unified APIs (CRM,
      Engagement, Ticketing) to identify which customer's provider connection
      to use for the request.
    category: API Headers

  - term: x-provider-name
    definition: >-
      An HTTP request header required by Supaglue's Unified APIs to specify
      which provider to route the request to (e.g. "salesforce", "hubspot",
      "pipedrive").
    category: API Headers

  - term: Schema
    definition: >-
      A Supaglue object schema definition that maps provider-specific field
      names to a normalized data model. Schemas define which fields are synced
      and how they are mapped between providers.
    category: Data Model

  - term: Field Mapping
    definition: >-
      Customer-specific overrides to the default schema field mappings. Allows
      customers to map provider fields to your application's data model.
    category: Data Model

  - term: Standard Object
    definition: >-
      A predefined CRM object type that all providers support, such as Contact,
      Account, Lead, or Opportunity. Accessed via /standard_objects/{name}/records.
    category: Data Model

  - term: Custom Object
    definition: >-
      A provider-specific object type defined by the customer or provider.
      Accessed via /custom_objects/{name}/records. Metadata is available
      via /metadata/custom_objects.
    category: Data Model

  - term: Upsert
    definition: >-
      A write operation that creates a new record if it doesn't exist, or
      updates it if it does, based on a unique match key. Used via _upsert
      subpaths (e.g. /contacts/_upsert).
    category: Operations

  - term: Association
    definition: >-
      A relationship between two CRM objects (e.g. Contact associated with
      Account). Accessed via /associations endpoint with from/to object types.
    category: Data Model
