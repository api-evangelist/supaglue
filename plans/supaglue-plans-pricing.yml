description: Supaglue was an open-source unified CRM API platform. The hosted/managed product is no
  longer offered; the GitHub repository was archived by the owner on 2024-03-10 and is read-only with
  no further releases past v0.25.2 (December 2023). Self-hosters can run the MIT-licensed code; there
  is no remaining vendor pricing.
sources:
  - https://github.com/supaglue-labs/supaglue
notes: 'Reconciliation marked false: project archived. The hosted/SaaS pricing page (supaglue.com/pricing)
  is no longer reachable (ECONNREFUSED). Only the open-source self-hosted distribution remains; there
  are no vendor plans to reconcile.'
plans:
  - id: supaglue-self-hosted
    name: Self-Hosted (Archived OSS)
    type: enterprise
    description: The open-source Supaglue distribution can still be self-hosted under the MIT license
      from the archived GitHub repository. There is no vendor support, updates, or commercial pricing.
    entries:
