naftiko: "1.0.0-alpha1"

info:
  label: "Supaglue Management API"
  description: "Configure customers, connections, sync configs, destinations, schemas, and sync operations for the Supaglue integration platform."
  tags:
    - Supaglue
    - Management
    - Customers
    - Connections
    - Sync
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SUPAGLUE_API_KEY: SUPAGLUE_API_KEY

capability:
  consumes:
    - type: http
      namespace: supaglue-mgmt
      baseUri: https://api.supaglue.io/mgmt/v2
      description: "Supaglue Management API"
      authentication:
        type: apikey
        key: x-api-key
        value: "{{SUPAGLUE_API_KEY}}"
        placement: header
      resources:
        - name: customers
          path: /customers
          description: "Manage integration customers"
          operations:
            - name: list-customers
              method: GET
              description: "List customers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: upsert-customer
              method: PUT
              description: "Upsert customer"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  customer_id: "{{tools.customer_id}}"
                  name: "{{tools.name}}"
                  email: "{{tools.email}}"

        - name: connections
          path: /customers/{customer_id}/connections
          description: "Manage customer connections to providers"
          operations:
            - name: list-connections
              method: GET
              description: "List customer connections"
              inputParameters:
                - name: customer_id
                  in: path
                  type: string
                  required: true
                  description: "Customer ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

        - name: sync-configs
          path: /sync_configs
          description: "Manage sync configurations"
          operations:
            - name: list-sync-configs
              method: GET
              description: "List sync configs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

        - name: syncs
          path: /syncs/_trigger
          description: "Control sync operations"
          operations:
            - name: trigger-sync
              method: POST
              description: "Trigger a sync"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  customer_id: "{{tools.customer_id}}"
                  provider_name: "{{tools.provider_name}}"

        - name: sync-runs
          path: /sync-runs
          description: "View sync run history"
          operations:
            - name: list-sync-runs
              method: GET
              description: "List sync runs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

        - name: magic-links
          path: /magic_links
          description: "Generate OAuth authentication magic links"
          operations:
            - name: list-magic-links
              method: GET
              description: "List magic links"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-magic-link
              method: POST
              description: "Create magic link"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  customer_id: "{{tools.customer_id}}"
                  provider_name: "{{tools.provider_name}}"

  exposes:
    - type: rest
      port: 8100
      namespace: supaglue-mgmt-api
      resources:
        - path: /v1/customers
          name: customers
          operations:
            - method: GET
              name: list-customers
              description: "List all integration customers"
              call: "supaglue-mgmt.list-customers"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/customers/{customer_id}/connections
          name: connections
          operations:
            - method: GET
              name: list-connections
              description: "List customer provider connections"
              call: "supaglue-mgmt.list-connections"
              with:
                customer_id: "rest.customer_id"
              outputParameters:
                - type: array
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: supaglue-mgmt-mcp
      transport: http
      tools:
        - name: list-customers
          description: "List all Supaglue integration customers"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-mgmt.list-customers"
          outputParameters:
            - type: array
              mapping: "$."
        - name: upsert-customer
          description: "Create or update a customer in the Supaglue platform"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-mgmt.upsert-customer"
          with:
            customer_id: "tools.customer_id"
            name: "tools.name"
            email: "tools.email"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-connections
          description: "List provider connections for a customer"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-mgmt.list-connections"
          with:
            customer_id: "tools.customer_id"
          outputParameters:
            - type: array
              mapping: "$."
        - name: trigger-sync
          description: "Trigger a data sync for a customer's connection"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-mgmt.trigger-sync"
          with:
            customer_id: "tools.customer_id"
            provider_name: "tools.provider_name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-sync-runs
          description: "List sync run history and status"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-mgmt.list-sync-runs"
          outputParameters:
            - type: array
              mapping: "$."
        - name: create-magic-link
          description: "Generate a magic link for customer OAuth authentication"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-mgmt.create-magic-link"
          with:
            customer_id: "tools.customer_id"
            provider_name: "tools.provider_name"
          outputParameters:
            - type: object
              mapping: "$."
