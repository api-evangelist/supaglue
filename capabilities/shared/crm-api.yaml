naftiko: "1.0.0-alpha1"

info:
  label: "Supaglue Unified CRM API"
  description: "Unified interface for CRM data (accounts, contacts, leads, opportunities) across Salesforce, HubSpot, Pipedrive, and other providers."
  tags:
    - Supaglue
    - CRM
    - Contacts
    - Accounts
    - Salesforce
    - HubSpot
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SUPAGLUE_API_KEY: SUPAGLUE_API_KEY

capability:
  consumes:
    - type: http
      namespace: supaglue-crm
      baseUri: https://api.supaglue.io/crm/v2
      description: "Supaglue Unified CRM API"
      authentication:
        type: apikey
        key: x-api-key
        value: "{{SUPAGLUE_API_KEY}}"
        placement: header
      resources:
        - name: accounts
          path: /accounts
          description: "CRM account operations"
          operations:
            - name: list-accounts
              method: GET
              description: "List accounts"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                  description: "Customer ID"
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
                  description: "Provider name (e.g. salesforce, hubspot)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-account
              method: POST
              description: "Create account"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  record: "{{tools.record}}"

        - name: contacts
          path: /contacts
          description: "CRM contact operations"
          operations:
            - name: list-contacts
              method: GET
              description: "List contacts"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-contact
              method: POST
              description: "Create contact"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  record: "{{tools.record}}"
            - name: search-contacts
              method: POST
              description: "Search contacts"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  filters: "{{tools.filters}}"

        - name: leads
          path: /leads
          description: "CRM lead operations"
          operations:
            - name: list-leads
              method: GET
              description: "List leads"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-lead
              method: POST
              description: "Create lead"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  record: "{{tools.record}}"

        - name: opportunities
          path: /opportunities
          description: "CRM opportunity operations"
          operations:
            - name: list-opportunities
              method: GET
              description: "List opportunities"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-opportunity
              method: POST
              description: "Create opportunity"
              inputParameters:
                - name: x-customer-id
                  in: header
                  type: string
                  required: true
                - name: x-provider-name
                  in: header
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  record: "{{tools.record}}"

  exposes:
    - type: rest
      port: 8101
      namespace: supaglue-crm-api
      resources:
        - path: /v1/crm/accounts
          name: accounts
          operations:
            - method: GET
              name: list-accounts
              description: "List CRM accounts"
              call: "supaglue-crm.list-accounts"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/crm/contacts
          name: contacts
          operations:
            - method: GET
              name: list-contacts
              description: "List CRM contacts"
              call: "supaglue-crm.list-contacts"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/crm/leads
          name: leads
          operations:
            - method: GET
              name: list-leads
              description: "List CRM leads"
              call: "supaglue-crm.list-leads"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/crm/opportunities
          name: opportunities
          operations:
            - method: GET
              name: list-opportunities
              description: "List CRM opportunities"
              call: "supaglue-crm.list-opportunities"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: supaglue-crm-mcp
      transport: http
      tools:
        - name: list-accounts
          description: "List CRM accounts from the specified provider"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-crm.list-accounts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-account
          description: "Create a new CRM account"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-crm.create-account"
          with:
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-contacts
          description: "List CRM contacts from the specified provider"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-crm.list-contacts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-contact
          description: "Create a new CRM contact"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-crm.create-contact"
          with:
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-contacts
          description: "Search CRM contacts by filter criteria"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-crm.search-contacts"
          with:
            filters: "tools.filters"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-leads
          description: "List CRM leads"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-crm.list-leads"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-lead
          description: "Create a new CRM lead"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-crm.create-lead"
          with:
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-opportunities
          description: "List CRM opportunities"
          hints:
            readOnly: true
            openWorld: false
          call: "supaglue-crm.list-opportunities"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-opportunity
          description: "Create a new CRM opportunity"
          hints:
            readOnly: false
            destructive: false
          call: "supaglue-crm.create-opportunity"
          with:
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."
