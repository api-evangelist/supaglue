naftiko: 1.0.0-alpha2
info:
  label: Unified Ticketing API (Preview) — Comments
  description: 'Unified Ticketing API (Preview) — Comments. 3 operations. Lead operation: List comments. Self-contained Naftiko
    capability covering one Supaglue business surface.'
  tags:
  - Supaglue
  - Comments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ticketing-comments
    baseUri: https://api.supaglue.io/ticketing/v2
    description: Unified Ticketing API (Preview) — Comments business capability. Self-contained, no shared references.
    resources:
    - name: comments
      path: /comments
      operations:
      - name: listcomments
        method: GET
        description: List comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcomment
        method: POST
        description: Create comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: comments-comment_id
      path: /comments/{comment_id}
      operations:
      - name: getcomment
        method: GET
        description: Get comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ticketing-comments-rest
    port: 8080
    description: REST adapter for Unified Ticketing API (Preview) — Comments. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/comments
      name: comments
      description: REST surface for comments.
      operations:
      - method: GET
        name: listcomments
        description: List comments
        call: ticketing-comments.listcomments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcomment
        description: Create comment
        call: ticketing-comments.createcomment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/comments/{comment-id}
      name: comments-comment-id
      description: REST surface for comments-comment_id.
      operations:
      - method: GET
        name: getcomment
        description: Get comment
        call: ticketing-comments.getcomment
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ticketing-comments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Unified Ticketing API (Preview) — Comments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-comments
      description: List comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ticketing-comments.listcomments
      outputParameters:
      - type: object
        mapping: $.
    - name: create-comment
      description: Create comment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ticketing-comments.createcomment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-comment
      description: Get comment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ticketing-comments.getcomment
      outputParameters:
      - type: object
        mapping: $.
