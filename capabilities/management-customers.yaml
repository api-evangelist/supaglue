naftiko: 1.0.0-alpha2
info:
  label: Management API — Customers
  description: 'Management API — Customers. 4 operations. Lead operation: List customers. Self-contained Naftiko capability
    covering one Supaglue business surface.'
  tags:
  - Supaglue
  - Customers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-customers
    baseUri: https://api.supaglue.io/mgmt/v2
    description: Management API — Customers business capability. Self-contained, no shared references.
    resources:
    - name: customers
      path: /customers
      operations:
      - name: getcustomers
        method: GET
        description: List customers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upsertcustomer
        method: PUT
        description: Upsert customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: customers-customer_id
      path: /customers/{customer_id}
      operations:
      - name: getcustomer
        method: GET
        description: Get customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletecustomer
        method: DELETE
        description: Delete customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: management-customers-rest
    port: 8080
    description: REST adapter for Management API — Customers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/customers
      name: customers
      description: REST surface for customers.
      operations:
      - method: GET
        name: getcustomers
        description: List customers
        call: management-customers.getcustomers
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: upsertcustomer
        description: Upsert customer
        call: management-customers.upsertcustomer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customers/{customer-id}
      name: customers-customer-id
      description: REST surface for customers-customer_id.
      operations:
      - method: GET
        name: getcustomer
        description: Get customer
        call: management-customers.getcustomer
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecustomer
        description: Delete customer
        call: management-customers.deletecustomer
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Management API — Customers. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-customers
      description: List customers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-customers.getcustomers
      outputParameters:
      - type: object
        mapping: $.
    - name: upsert-customer
      description: Upsert customer
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-customers.upsertcustomer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer
      description: Get customer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-customers.getcustomer
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-customer
      description: Delete customer
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-customers.deletecustomer
      outputParameters:
      - type: object
        mapping: $.
