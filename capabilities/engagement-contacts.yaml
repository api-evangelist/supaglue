    baseUri: https://api.supaglue.io/engagement/v2
    description: Unified Engagement API — Contacts business capability. Self-contained, no shared references.
    resources:
    - name: contacts
      path: /contacts
      operations:
      - name: createcontact
        method: POST
        description: Create contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listcontacts
        method: GET
        description: List contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: contacts-_search
      path: /contacts/_search
      operations:
      - name: searchcontacts
        method: POST
        description: Search contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: contacts-contact_id
      path: /contacts/{contact_id}
      operations:
      - name: getcontact
        method: GET
        description: Get contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecontact
        method: PATCH
        description: Update contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: engagement-contacts-rest
    port: 8080
    description: REST adapter for Unified Engagement API — Contacts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/contacts
      name: contacts
      description: REST surface for contacts.
      operations:
      - method: POST
        name: createcontact
        description: Create contact
        call: engagement-contacts.createcontact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listcontacts
        description: List contacts
        call: engagement-contacts.listcontacts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts/search
      name: contacts-search
      description: REST surface for contacts-_search.
      operations:
      - method: POST
        name: searchcontacts
        description: Search contacts
        call: engagement-contacts.searchcontacts
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts/{contact-id}
