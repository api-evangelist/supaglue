      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: engagement-contacts.searchcontacts
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-contact
      description: Get contact
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: engagement-contacts.getcontact
      outputParameters:
      - type: object
        mapping: $.
    - name: update-contact
      description: Update contact
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: engagement-contacts.updatecontact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
