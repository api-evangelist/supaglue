      operations:
      - method: GET
        name: getcontact
        description: Get contact
        call: engagement-contacts.getcontact
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatecontact
        description: Update contact
        call: engagement-contacts.updatecontact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
