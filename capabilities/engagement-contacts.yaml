naftiko: 1.0.0-alpha2
info:
  label: Unified Engagement API — Contacts
  description: 'Unified Engagement API — Contacts. 5 operations. Lead operation: Create contact. Self-contained Naftiko capability
    covering one Supaglue business surface.'
  tags:
  - Supaglue
  - Contacts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
