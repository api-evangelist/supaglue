    description: Unified Engagement API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: createaccount
        method: POST
        description: Create account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listaccounts
        method: GET
        description: List accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-_search
      path: /accounts/_search
      operations:
      - name: searchaccounts
        method: POST
        description: Search accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
