naftiko: 1.0.0-alpha2
info:
  label: Management API — Destinations
  description: 'Management API — Destinations. 4 operations. Lead operation: List destinations. Self-contained Naftiko capability
    covering one Supaglue business surface.'
  tags:
  - Supaglue
  - Destinations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-destinations
    baseUri: https://api.supaglue.io/mgmt/v2
    description: Management API — Destinations business capability. Self-contained, no shared references.
    resources:
    - name: destinations
      path: /destinations
      operations:
      - name: getdestinations
        method: GET
        description: List destinations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdestination
        method: POST
        description: Create destination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: destinations-destination_id
      path: /destinations/{destination_id}
      operations:
      - name: getdestination
        method: GET
        description: Get destination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatedestination
        method: PUT
        description: Update destination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: management-destinations-rest
    port: 8080
    description: REST adapter for Management API — Destinations. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/destinations
      name: destinations
      description: REST surface for destinations.
      operations:
      - method: GET
        name: getdestinations
        description: List destinations
        call: management-destinations.getdestinations
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdestination
        description: Create destination
        call: management-destinations.createdestination
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/destinations/{destination-id}
      name: destinations-destination-id
      description: REST surface for destinations-destination_id.
      operations:
      - method: GET
        name: getdestination
        description: Get destination
        call: management-destinations.getdestination
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatedestination
        description: Update destination
        call: management-destinations.updatedestination
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-destinations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Management API — Destinations. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-destinations
      description: List destinations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-destinations.getdestinations
      outputParameters:
      - type: object
        mapping: $.
    - name: create-destination
      description: Create destination
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-destinations.createdestination
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-destination
      description: Get destination
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-destinations.getdestination
      outputParameters:
      - type: object
        mapping: $.
    - name: update-destination
      description: Update destination
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-destinations.updatedestination
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
