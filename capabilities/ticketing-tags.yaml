naftiko: 1.0.0-alpha2
info:
  label: Unified Ticketing API (Preview) — Tags
  description: 'Unified Ticketing API (Preview) — Tags. 2 operations. Lead operation: List tags. Self-contained Naftiko capability
    covering one Supaglue business surface.'
  tags:
  - Supaglue
  - Tags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ticketing-tags
    baseUri: https://api.supaglue.io/ticketing/v2
    description: Unified Ticketing API (Preview) — Tags business capability. Self-contained, no shared references.
    resources:
    - name: tags
      path: /tags
      operations:
      - name: listtags
        method: GET
        description: List tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tags-tag_id
      path: /tags/{tag_id}
      operations:
      - name: gettag
        method: GET
        description: Get tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: ticketing-tags-rest
    port: 8080
    description: REST adapter for Unified Ticketing API (Preview) — Tags. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/tags
      name: tags
      description: REST surface for tags.
      operations:
      - method: GET
        name: listtags
        description: List tags
        call: ticketing-tags.listtags
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tags/{tag-id}
      name: tags-tag-id
      description: REST surface for tags-tag_id.
      operations:
      - method: GET
        name: gettag
        description: Get tag
        call: ticketing-tags.gettag
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ticketing-tags-mcp
    port: 9090
    transport: http
    description: MCP adapter for Unified Ticketing API (Preview) — Tags. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-tags
      description: List tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ticketing-tags.listtags
      outputParameters:
      - type: object
        mapping: $.
    - name: get-tag
      description: Get tag
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ticketing-tags.gettag
      outputParameters:
      - type: object
        mapping: $.
