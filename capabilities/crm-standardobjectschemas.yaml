naftiko: 1.0.0-alpha2
info:
  label: Unified CRM API — StandardObjectSchemas
  description: 'Unified CRM API — StandardObjectSchemas. 1 operations. Lead operation: List standard object schemas. Self-contained
    Naftiko capability covering one Supaglue business surface.'
  tags:
  - Supaglue
  - StandardObjectSchemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: crm-standardobjectschemas
    baseUri: https://api.supaglue.io/crm/v2
    description: Unified CRM API — StandardObjectSchemas business capability. Self-contained, no shared references.
    resources:
    - name: metadata-standard_objects
      path: /metadata/standard_objects
      operations:
      - name: liststandardobjectschemas
        method: GET
        description: List standard object schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crm-standardobjectschemas-rest
    port: 8080
    description: REST adapter for Unified CRM API — StandardObjectSchemas. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/metadata/standard-objects
      name: metadata-standard-objects
      description: REST surface for metadata-standard_objects.
      operations:
      - method: GET
        name: liststandardobjectschemas
        description: List standard object schemas
        call: crm-standardobjectschemas.liststandardobjectschemas
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crm-standardobjectschemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for Unified CRM API — StandardObjectSchemas. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-standard-object-schemas
      description: List standard object schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crm-standardobjectschemas.liststandardobjectschemas
      outputParameters:
      - type: object
        mapping: $.
