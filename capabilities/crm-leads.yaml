        method: GET
        description: Get lead
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelead
        method: PATCH
        description: Update lead
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crm-leads-rest
    port: 8080
    description: REST adapter for Unified CRM API — Leads. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/leads
      name: leads
      description: REST surface for leads.
      operations:
      - method: POST
        name: createlead
        description: Create lead
        call: crm-leads.createlead
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listleads
        description: List leads
        call: crm-leads.listleads
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/leads/search
