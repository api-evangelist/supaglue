    baseUri: https://api.supaglue.io/crm/v2
    description: Unified CRM API — Leads business capability. Self-contained, no shared references.
    resources:
    - name: leads
      path: /leads
      operations:
      - name: createlead
        method: POST
        description: Create lead
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listleads
        method: GET
        description: List leads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: leads-_search
      path: /leads/_search
      operations:
      - name: searchleads
        method: POST
        description: Search leads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: leads-_upsert
      path: /leads/_upsert
      operations:
      - name: upsertlead
        method: POST
        description: Upsert lead
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
