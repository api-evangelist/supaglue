naftiko: 1.0.0-alpha2
info:
  label: Unified CRM API — Leads
  description: 'Unified CRM API — Leads. 6 operations. Lead operation: Create lead. Self-contained Naftiko capability covering
    one Supaglue business surface.'
  tags:
  - Supaglue
  - Leads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
