          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crm-leads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Unified CRM API — Leads. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
