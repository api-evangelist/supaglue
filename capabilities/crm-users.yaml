naftiko: 1.0.0-alpha2
info:
  label: Unified CRM API — Users
  description: 'Unified CRM API — Users. 2 operations. Lead operation: List users. Self-contained Naftiko capability covering
    one Supaglue business surface.'
  tags:
  - Supaglue
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPAGLUE_API_KEY: SUPAGLUE_API_KEY
capability:
  consumes:
  - type: http
    namespace: crm-users
    baseUri: https://api.supaglue.io/crm/v2
    description: Unified CRM API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-user_id
      path: /users/{user_id}
      operations:
      - name: getuser
        method: GET
        description: Get user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SUPAGLUE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: crm-users-rest
    port: 8080
    description: REST adapter for Unified CRM API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List users
        call: crm-users.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{user-id}
      name: users-user-id
      description: REST surface for users-user_id.
      operations:
      - method: GET
        name: getuser
        description: Get user
        call: crm-users.getuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crm-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Unified CRM API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crm-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crm-users.getuser
      outputParameters:
      - type: object
        mapping: $.
