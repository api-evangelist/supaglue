openapi: 3.0.3
info:
  version: 0.25.7
  title: Unified CRM Accounts Destinations API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: '#### Introduction


    Welcome to the Unified API (CRM) documentation. You can use this API to write to multiple third-party providers within the CRM category.


    [View common schema for CRM](https://docs.supaglue.com/platform/common-schemas/crm)


    #### Base API URL

    ```

    https://api.supaglue.io/crm/v2

    ```

    '
servers:
- url: https://api.supaglue.io/crm/v2
  description: Supaglue API
tags:
- name: Destinations
  description: A `Destination` is a data store where we write data in your infrastructure.
paths:
  /destinations:
    get:
      operationId: getDestinations
      tags:
      - Destinations
      security:
      - x-api-key: []
      summary: List destinations
      description: Get a list of destinations
      responses:
        '200':
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/destination'
                example:
                - id: 92bc3460-a301-4116-8d1f-6e5f8252c2e2
                  application_id: 9b9a31bb-9fe4-4fa5-ba84-4c035a27f258
                  name: My Postgres Destination
                  type: postgres
                  config:
                    host: production-db-new.cluster-cdhnnutnlctj.us-west-2.rds.amazonaws.com
                    port: 5432
                    database: my_database
                    schema: public
                    user: user
                    password: password
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
    post:
      operationId: createDestination
      summary: Create destination
      tags:
      - Destinations
      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_destination'
      responses:
        '201':
          description: Destination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /destinations/{destination_id}:
    parameters:
    - name: destination_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getDestination
      summary: Get destination
      tags:
      - Destinations
      security:
      - x-api-key: []
      responses:
        '200':
          description: Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
    put:
      operationId: updateDestination
      summary: Update destination
      tags:
      - Destinations
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_destination'
      responses:
        '200':
          description: Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
components:
  schemas:
    update_destination:
      example:
        name: My Postgres Destination
        type: postgres
        config:
          host: production-db-new.cluster-cdhnnutnlctj.us-west-2.rds.amazonaws.com
          port: 5432
          database: postgres_prod_db
          schema: public
          user: myuser
          password: mysensitivepassword
      oneOf:
      - type: object
        title: postgres
        properties:
          name:
            type: string
            example: My Postgres Destination
          type:
            type: string
            enum:
            - postgres
            example: postgres
          config:
            $ref: '#/components/schemas/postgres_config_at_least_safe'
          version:
            type: number
            example: number
        required:
        - name
        - type
        - config
        - version
      - type: object
        title: bigquery
        properties:
          name:
            type: string
            example: My BigQuery Destination
          type:
            type: string
            enum:
            - bigquery
            example: bigquery
          config:
            $ref: '#/components/schemas/bigquery_config_at_least_safe'
          version:
            type: number
            example: number
        required:
        - name
        - type
        - config
        - version
    snowflake_config_unsafe:
      type: object
      properties:
        host:
          type: string
          example: paa05704.us-east-1
        role:
          type: string
          example: supaglue
        warehouse:
          type: string
          example: compute
        database:
          type: string
          example: my_database
        schema:
          type: string
          example: schema
        username:
          type: string
          example: snowflake_user
        password:
          type: string
          example: 12345fakepassword
      required:
      - host
      - role
      - warehouse
      - database
      - schema
      - username
      - password
    postgres_config_at_least_safe:
      type: object
      properties:
        host:
          type: string
          example: production-db-new.cluster-cdhnnutnlctj.us-west-2.rds.amazonaws.com
        port:
          type: number
          example: 5432
        database:
          type: string
          example: postgres_prod_db
        schema:
          type: string
          example: public
        user:
          type: string
          example: myuser
        password:
          type: string
          example: mysensitivepassword
      required:
      - host
      - port
      - database
      - schema
      - user
    s3_config_safe:
      type: object
      properties:
        bucket:
          type: string
          example: s3://my-bucket-name
        region:
          type: string
          example: us-west-2
        access_key_id:
          type: string
          example: AKIDFIAKFISDKFSI
      required:
      - bucket
      - region
      - access_key_id
    bigquery_config_safe:
      type: object
      properties:
        project_id:
          type: string
          example: my-gcp-project-id
        dataset:
          type: string
          example: my_bigquery_dataset
        credentials:
          type: object
          properties:
            client_email:
              type: string
              example: my_bigquery_service_account@my_project.iam.gserviceaccount.com
          required:
          - client_email
      required:
      - project_id
      - dataset
      - credentials
    create_destination:
      oneOf:
      - type: object
        title: postgres
        properties:
          name:
            type: string
            example: My Postgres Destination
          type:
            type: string
            enum:
            - postgres
            example: postgres
          config:
            $ref: '#/components/schemas/postgres_config_unsafe'
        required:
        - name
        - type
        - config
      - type: object
        title: supaglue
        description: A Supaglue-hosted Postgres database destination for Listing APIs.
        properties:
          type:
            type: string
            enum:
            - supaglue
            example: supaglue
        required:
        - type
      - type: object
        title: bigquery
        properties:
          name:
            type: string
            example: My BigQuery Destination
          type:
            type: string
            enum:
            - bigquery
            example: bigquery
          config:
            $ref: '#/components/schemas/bigquery_config_unsafe'
        required:
        - name
        - type
        - config
      - type: object
        title: snowflake
        properties:
          name:
            type: string
            example: My Snowflake Destination
          type:
            type: string
            enum:
            - snowflake
            example: snowflake
          config:
            $ref: '#/components/schemas/snowflake_config_unsafe'
        required:
        - name
        - type
        - config
      - type: object
        title: redshift
        properties:
          name:
            type: string
            example: My Redshift Destination
          type:
            type: string
            enum:
            - redshift
            example: redshift
          config:
            $ref: '#/components/schemas/redshift_config_unsafe'
        required:
        - name
        - type
        - config
    postgres_config_unsafe:
      type: object
      properties:
        host:
          type: string
          example: production-db-new.cluster-cdhnnutnlctj.us-west-2.rds.amazonaws.com
        port:
          type: number
          example: 5432
        database:
          type: string
          example: postgres_prod_db
        schema:
          type: string
          example: public
        user:
          type: string
          example: myuser
        ssl_mode:
          type: string
          enum:
          - disable
          - no-verify
          - prefer
          - require
          - verify-ca
          - verify-full
          example: disable
        password:
          type: string
          example: mysensitivepassword
        server_ca_cert:
          type: string
          example: '---BEGIN CERTIFICATE-----'
        client_cert:
          type: string
          example: '---BEGIN CERTIFICATE-----'
        client_key:
          type: string
          example: '---BEGIN RSA PRIVATE KEY-----'
        server_name:
          type: string
          example: 1-dd8643d8-f1ce-420f-a867-66b78a4734be.us-central1.sql.goog
      required:
      - host
      - port
      - database
      - schema
      - user
      - password
    snowflake_config_safe:
