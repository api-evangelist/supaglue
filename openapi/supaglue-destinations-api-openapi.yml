          type: string
          example: my-gcp-project-id
        dataset:
          type: string
          example: my_bigquery_dataset
        credentials:
          type: object
          properties:
            client_email:
              type: string
              example: my_bigquery_service_account@my_project.iam.gserviceaccount.com
            private_key:
              type: string
              example: '-----BEGIN PRIVATE KEY-----\nMII...'
          required:
          - client_email
          - private_key
      required:
