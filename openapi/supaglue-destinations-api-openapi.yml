        warehouse:
          type: string
          example: compute
        database:
          type: string
          example: my_database
        schema:
          type: string
          example: schema
        username:
          type: string
          example: snowflake_user
      required:
      - host
      - role
      - warehouse
      - database
      - schema
      - username
    postgres_config_safe:
      type: object
      properties:
        host:
          type: string
          example: production-db-new.cluster-cdhnnutnlctj.us-west-2.rds.amazonaws.com
        port:
          type: number
          example: 5432
        database:
