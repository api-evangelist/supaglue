      type: object
      properties:
        account_id:
          type:
          - string
          - 'null'
          example: fd089246-09b1-4e3b-a60a-7a76314bbcce
        amount:
          type:
          - integer
          - 'null'
          example: 100000
        close_date:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-27T00:00:00Z'
        description:
          type:
          - string
          - 'null'
          example: Wants to use open source unified API for third-party integrations
        id:
          type: string
          example: 54312
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-27T00:00:00Z'
        name:
          type:
          - string
          - 'null'
          example: Needs third-party integrations
        owner_id:
          type:
          - string
          - 'null'
          example: d8ceb3ff-8b7f-4fa7-b8de-849292f6ca69
        pipeline:
          type:
          - string
          - 'null'
        stage:
          type:
          - string
          - 'null'
          example: Closed Won
        status:
          type:
          - string
          - 'null'
          example: OPEN
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-27T00:00:00Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-27T00:00:00Z'
        is_deleted:
          type: boolean
          example: false
        last_modified_at:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
      required:
      - account_id
      - amount
      - description
      - id
      - last_activity_at
      - name
      - owner_id
      - stage
      - status
      - pipeline
      - created_at
      - updated_at
      - is_deleted
      - last_modified_at
    custom_fields:
      type: object
      additionalProperties: true
      description: Custom properties to be inserted that are not covered by the common object. Object keys must match exactly to the corresponding provider API.
    created_record:
      type: object
      properties:
        id:
          type: string
      required:
      - id
  securitySchemes:
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header
      description: API key to allow developers to access the API
