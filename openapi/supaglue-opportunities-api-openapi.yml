      type: array
      items:
        type: object
        properties:
          detail:
            type: string
          problem_type:
            type: string
          title:
            type: string
    create_update_opportunity:
      type: object
      properties:
        amount:
          type:
          - integer
          - 'null'
          example: 100000
        close_date:
          type:
          - string
          - 'null'
          example: '2022-02-10T00:00:00Z'
        description:
          type:
          - string
          - 'null'
          example: Wants to use open source unified API for third-party integrations
        name:
          type:
          - string
          - 'null'
          example: Needs Integrations
        stage:
          type: string
          example: Closed Won
        account_id:
          type:
          - string
          - 'null'
          example: 64571bff-48ea-4469-9fa0-ee1a0bab38bd
        owner_id:
          type:
          - string
          - 'null'
          example: 9f3e97fd-4d5d-4efc-959d-bbebfac079f5
        pipeline:
          type:
          - string
          - 'null'
        custom_fields:
          $ref: '#/components/schemas/custom_fields'
    pagination:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjQyNTc5ZjczLTg1MjQtNDU3MC05YjY3LWVjYmQ3MDJjNmIxNCIsInJldmVyc2UiOmZhbHNlfQ==
        previous:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjBjZDhmYmZkLWU5NmQtNDEwZC05ZjQxLWIwMjU1YjdmNGI4NyIsInJldmVyc2UiOnRydWV9
        total_count:
          type: number
          example: 100
      required:
      - next
      - previous
