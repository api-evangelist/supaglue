        title:
          type:
          - string
          - 'null'
          example: Co-Founder
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-10T00:00:00Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-02-10T00:00:00Z'
        is_deleted:
          type: boolean
          example: false
        last_modified_at:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
      required:
      - addresses
      - company
      - converted_account_id
      - converted_contact_id
      - converted_date
      - id
      - last_name
      - lead_source
      - owner_id
      - phone_numbers
      - title
      - created_at
      - updated_at
      - is_deleted
      - last_modified_at
    contact:
      type: object
      properties:
        account_id:
          type:
          - string
          - 'null'
          example: fd089246-09b1-4e3b-a60a-7a76314bbcce
        owner_id:
          type:
          - string
          - 'null'
          example: 23e640fe-6105-4a11-a636-3aa6b6c6e762
        addresses:
          $ref: '#/components/schemas/addresses'
        email_addresses:
          $ref: '#/components/schemas/email_addresses'
        first_name:
          type:
          - string
          - 'null'
          example: George
        id:
          type: string
          example: 54312
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
        last_name:
          type:
          - string
          - 'null'
          example: Xing
        phone_numbers:
          $ref: '#/components/schemas/phone_numbers'
        lifecycle_stage:
          $ref: '#/components/schemas/lifecycle_stage'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
        is_deleted:
          type: boolean
          example: false
        last_modified_at:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
        raw_data:
          type: object
          additionalProperties: true
      required:
      - account_id
      - owner_id
      - description
      - id
      - addresses
      - email_addresses
      - first_name
      - last_activity_at
      - last_name
      - phone_numbers
      - lifecycle_stage
      - created_at
      - updated_at
      - is_deleted
      - last_modified_at
    warnings:
      type: array
      items:
