      - owner_id
      - description
      - id
      - addresses
      - email_addresses
      - first_name
      - last_activity_at
      - last_name
      - phone_numbers
      - lifecycle_stage
      - created_at
      - updated_at
      - is_deleted
      - last_modified_at
    create_update_contact:
      type: object
      properties:
        first_name:
          type:
          - string
          - 'null'
          example: George
        last_name:
          type:
          - string
          - 'null'
          example: Xing
        account_id:
          type:
          - string
          - 'null'
          example: 64571bff-48ea-4469-9fa0-ee1a0bab38bd
        addresses:
          $ref: '#/components/schemas/addresses'
        email_addresses:
          $ref: '#/components/schemas/email_addresses'
        phone_numbers:
