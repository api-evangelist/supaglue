openapi: 3.2.0
info:
  version: 0.25.7
  title: Unified Ticketing API (Preview) Attachments API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: ':::note

    This feature is only available in Preview to select customers on our Enterprise plan. [Contact us](mailto:team@supaglue.com) for more information.

    :::

    #### Introduction


    Welcome to the Unified API (Ticketing) documentation. You can use this API to write to third-party providers.


    [View common schema for Ticketing](https://docs.supaglue.com/platform/common-schemas/ticketing)


    [![Run in Postman](https://run.pstmn.io/button.svg)](https://www.postman.com/supaglue/workspace/supaglue-public/overview)


    #### Base API URL

    ```

    https://api.supaglue.io/ticketing/v2

    ```

    '
servers:
- url: https://api.supaglue.io/ticketing/v2
  description: Supaglue API
tags:
- name: Attachments
  description: 'The Attachment object is used to represent an attachment for a ticket.

    '
paths:
  /attachments:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    get:
      operationId: listAttachments
      summary: List attachments
      description: ':::note

        This feature is only available in Preview to select customers on our Enterprise plan. [Contact us](mailto:team@supaglue.com) for more information.

        :::


        Returns a list of Attachment objects.

        '
      tags:
      - Attachments
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: AttachmentsData
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/attachment'
                required:
                - pagination
                - records
    post:
      operationId: createAttachment
      summary: Create attachment
      description: Creates a Attachment object with the given values.
      tags:
      - Attachments
      parameters: []
      security:
      - x-api-key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record:
                  type: object
                  properties:
                    file_name:
                      type: string
                      example: Screenshot.png
                    ticket:
                      type: string
                      example: 0958cbc6-6040-430a-848e-aafacbadf4ae
                    file_url:
                      type: string
                      example: http://alturl.com/p749b
                    content_type:
                      type: string
                      example: jpeg
                    uploaded_by:
                      type: string
                      example: 28b54125-287f-494d-965e-3c5b330c9a68
                  required:
                  - file_name
                  - ticket
                  - file_url
                  - content_type
                  - uploaded_by
              required:
              - record
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/errors'
                  record:
                    $ref: '#/components/schemas/created_record'
                  warnings:
                    $ref: '#/components/schemas/warnings'
  /attachments/{attachment_id}:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    - name: attachment_id
      in: path
      required: true
      schema:
        type: string
      example: 0258cbc6-6020-430a-848e-aafacbadf4ae
    get:
      operationId: getAttachment
      summary: Get attachment
      description: ':::note

        This feature is only available in Preview to select customers on our Enterprise plan. [Contact us](mailto:team@supaglue.com) for more information.

        :::


        Returns an Attachment object with the given id.

        '
      tags:
      - Attachments
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/include_raw_data'
      responses:
        '200':
          description: attachmentData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachment'
