openapi: 3.0.3
info:
  version: 0.25.7
  title: Unified CRM Accounts CustomObjectSchemas API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: '#### Introduction


    Welcome to the Unified API (CRM) documentation. You can use this API to write to multiple third-party providers within the CRM category.


    [View common schema for CRM](https://docs.supaglue.com/platform/common-schemas/crm)


    #### Base API URL

    ```

    https://api.supaglue.io/crm/v2

    ```

    '
servers:
- url: https://api.supaglue.io/crm/v2
  description: Supaglue API
tags:
- name: CustomObjectSchemas
  description: A `Custom Object Schema` is an object schema defined by the user.
paths:
  /metadata/custom_objects:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    get:
      operationId: listCustomObjectSchemas
      summary: List custom object schemas
      tags:
      - CustomObjectSchemas
      security:
      - x-api-key: []
      description: 'List custom object schemas


        Support:


        | Provider    | Supported |

        | ----------- | --------- |

        | Hubspot     | Yes       |

        | Salesforce  | Yes       |

        | Pipedrive   | No        |

        | MS Dynamics | No        |

        '
      parameters: []
      responses:
        '200':
          description: An array containing the names and labels of Custom Objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/simple_custom_object_schema'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
    post:
      operationId: createCustomObjectSchema
      summary: Create custom object schema
      tags:
      - CustomObjectSchemas
      parameters: []
      description: 'Create custom object schema


        Support:


        | Provider    | Supported | Notes                                                   |

        | ----------- | --------- | ------------------------------------------------------- |

        | Hubspot     | Yes       | All field types supported except picklist/multipicklist |

        | Salesforce  | Yes       | All field types supported except picklist/multipicklist |

        | Pipedrive   | No        |                                                         |

        | MS Dynamics | No        |                                                         |

        '
      security:
      - x-api-key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object:
                  $ref: '#/components/schemas/create_custom_object_schema'
              required:
              - object
      responses:
        '201':
          description: Custom Object Schema created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: object
                    properties:
                      name:
                        type: string
                    required:
                    - name
                  warnings:
                    $ref: '#/components/schemas/warnings'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /metadata/custom_objects/{object_name}:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    - $ref: '#/components/parameters/object_name'
    get:
      operationId: getCustomObjectSchema
      summary: Get custom object schema details
      tags:
      - CustomObjectSchemas
      security:
      - x-api-key: []
      description: 'Get custom object schema details


        Support:


        | Provider    | Supported |

        | ----------- | --------- |

        | Hubspot     | Yes       |

        | Salesforce  | Yes       |

        | Pipedrive   | No        |

        | MS Dynamics | No        |

        '
      responses:
        '200':
          description: CustomObject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom_object_schema'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
    put:
      operationId: updateCustomObjectSchema
      summary: Update custom object schema
      tags:
      - CustomObjectSchemas
      description: 'Update custom object schema


        Support:


        | Provider    | Supported | Notes                                                   |

        | ----------- | --------- | ------------------------------------------------------- |

        | Hubspot     | Yes       | All field types supported except picklist/multipicklist |

        | Salesforce  | Yes       | All field types supported except picklist/multipicklist |

        | Pipedrive   | No        |                                                         |

        | MS Dynamics | No        |                                                         |

        '
      security:
      - x-api-key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object:
                  $ref: '#/components/schemas/update_custom_object_schema'
              required:
              - object
      responses:
        '200':
          description: Custom Object Schema updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    $ref: '#/components/schemas/warnings'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
components:
  schemas:
    create_custom_object_schema:
      type: object
      properties:
        name:
          type: string
          example: ticket
          description: The name you'd like to use for the custom object. For Salesforce, we will append `__c` if necessary. For HubSpot, it will pass through as-is.
        description:
          type: string
          nullable: true
          example: Ticket object
        labels:
          type: object
          properties:
            singular:
              type: string
              example: Ticket
            plural:
              type: string
              example: Tickets
          required:
          - singular
          - plural
        primary_field_id:
          type: string
          description: The key name of the "primary" field. For example, in HubSpot, this is the field that will be displayed for a record in the UI by default. For Salesforce, this will be referenced as the "Name" field.
          example: ticket_id
        fields:
          type: array
          items:
            $ref: '#/components/schemas/custom_object_field'
      required:
      - name
      - description
      - labels
      - primary_field_id
      - fields
    property_type:
      type: string
      enum:
      - text
      - textarea
      - number
      - picklist
      - multipicklist
      - date
      - datetime
      - boolean
      - url
      - other
      description: "Type of the field.\n\n:::note\n`picklist` and `multipicklist` property types are currently only supported in Salesforce and Hubspot\n:::\n\n:::note\n`url` property type currently is only natively supported in Salesforce.\n:::\n\nSupport:\n\n<table>\n  <thead>\n    <tr>\n      <th>Type</th>\n      <th>Hubspot (type-fieldType)</th>\n      <th>Salesforce</th>\n      <th>Pipedrive</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>text</td>\n      <td>string-text</td>\n      <td>Text</td>\n      <td>varchar_auto</td>\n    </tr>\n    <tr>\n      <td>textarea</td>\n      <td>string-textarea</td>\n      <td>Textarea</td>\n      <td>text</td>\n    </tr>\n    <tr>\n      <td>number</td>\n      <td>number-number</td>\n      <td>Int/Double (depending on scale)</td>\n      <td>double</td>\n    </tr>\n    <tr>\n      <td>picklist</td>\n      <td>enumeration-select</td>\n      <td>Picklist</td>\n      <td>enum</td>\n    </tr>\n    <tr>\n      <td>multipicklist</td>\n      <td>enumeration-checkbox</td>\n      <td>Multipicklist</td>\n      <td>set</td>\n    </tr>\n    <tr>\n      <td>date</td>\n      <td>date-date</td>\n      <td>Date</td>\n      <td>date</td>\n    </tr>\n    <tr>\n      <td>datetime</td>\n      <td>datetime-date</td>\n      <td>Datetime</td>\n      <td>date</td>\n    </tr>\n    <tr>\n      <td>boolean</td>\n      <td>bool-booleancheckbox</td>\n      <td>Checkbox</td>\n      <td>enum</td>\n    </tr>\n    <tr>\n      <td>url</td>\n      <td>Not Supported</td>\n      <td>Url</td>\n      <td>Not Supported</td>\n    </tr>\n  </tbody>\n  </table>\n"
    simple_custom_object_schema:
      type: object
      properties:
        name:
          type: string
          example: ticket
        labels:
          type: object
          properties:
            singular:
              type: string
              example: Ticket
            plural:
              type: string
              example: Tickets
          required:
          - singular
          - plural
      required:
      - name
      - label
    custom_object_schema:
      type: object
      properties:
        name:
          type: string
          example: ticket
        description:
          type: string
          nullable: true
          example: Ticket object
        labels:
          type: object
          properties:
            singular:
              type: string
              example: Ticket
            plural:
              type: string
              example: Tickets
          required:
          - singular
          - plural
        fields:
          type: array
          items:
            $ref: '#/components/schemas/custom_object_field'
      required:
      - name
      - description
      - labels
      - fields
    warnings:
      type: array
      items:
        type: object
        properties:
          detail:
            type: string
          problem_type:
            type: string
          title:
            type: string
    update_custom_object_schema:
      type: object
      properties:
        description:
          type: string
          nullable: true
          example: Ticket object
        labels:
          type: object
          properties:
            singular:
              type: string
              example: Ticket
            plural:
              type: string
              example: Tickets
          required:
          - singular
          - plural
        primary_field_id:
          type: string
          description: The key name of the "primary" field. For example, in HubSpot, this is the field that will be displayed for a record in the UI by default. For Salesforce, this will be referenced as the "Name" field.
          example: ticket_id
        fields:
          type: array
          items:
            $ref: '#/components/schemas/custom_object_field'
      required:
      - description
      - labels
      - primary_field_id
      - fields
    picklist_option:
      type: object
      properties:
        label:
          type: string
          example: Option 1
        value:
          type: string
          example: option_1
        description:
          type: string
          description: A description of this option.
        hidden:
          type: boolean
          description: Defaults to false.
      required:
      - label
      - value
    errors:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier for the instance of the error. Provide this to support when contacting Supaglue.
            example: 9366efb4-8fb1-4a28-bfb0-8d6f9cc6b5c5
          detail:
            type: string
            description: A detailed description of the error.
            example: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
          problem_type:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
            deprecated: true
          title:
            type: string
            description: A brief description of the error. The schema and type of message will vary by Provider.
            example: 'Property values were not valid

              '
          code:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
          status:
            type: string
            description: The HTTP status code associated with the error.
            example: '400'
          meta:
            type: object
            description: Additional metadata about the error.
            properties:
              cause:
                type: object
                description: The cause of the error. Usually the underlying error from the remote Provider.
                example:
                  code: 400
                  body:
                    status: error
                    message: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
                    correlationId: ac94252c-90b5-45d2-ad1d-9a9f7651d7d2
                    category: VALIDATION_ERROR
                  headers:
                    access-control-allow-credentials: 'false'
                    cf-cache-status: DYNAMIC
                    cf-ray: 8053d17b9dae9664-SJC
