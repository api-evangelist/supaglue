openapi: 3.0.3
info:
  version: 0.25.7
  title: Unified CRM Accounts Sequence States API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: '#### Introduction


    Welcome to the Unified API (CRM) documentation. You can use this API to write to multiple third-party providers within the CRM category.


    [View common schema for CRM](https://docs.supaglue.com/platform/common-schemas/crm)


    #### Base API URL

    ```

    https://api.supaglue.io/crm/v2

    ```

    '
servers:
- url: https://api.supaglue.io/crm/v2
  description: Supaglue API
tags:
- name: Sequence States
  description: The `Sequence State` Common Object represents the state of a contact in a sequence, commonly known as a "sequence membership".
paths:
  /sequence_states:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    post:
      operationId: createSequenceState
      summary: Create sequence state
      description: 'Add a contact to a sequence. If the contact is already in the sequence, it will return the id of the existing sequence state.

        '
      tags:
      - Sequence States
      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record:
                  $ref: '#/components/schemas/create_sequence_state'
              required:
              - record
            example:
              record:
                id: 355843a5-c536-4e82-b497-05160bfb7d78
                state: active
                mailbox_id: a7e860b5-cb8b-400b-812d-921fa526140c
                sequencestate_id: 6bdcebc2-f886-4de3-88ed-0b9eb420f7b1
                sequence_id: 45e07817-fd59-4ec8-a727-066d2db27c9b
                created_at: '2023-02-27T00:00:00Z'
                updated_at: '2023-02-27T00:00:00Z'
      responses:
        '201':
          description: Sequence state created
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    $ref: '#/components/schemas/created_record'
                  warnings:
                    $ref: '#/components/schemas/warnings'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
    get:
      operationId: listSequenceStates
      summary: List sequence states
      tags:
      - Sequence States
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/include_raw_data'
      - $ref: '#/components/parameters/read_from_cache'
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated Sequence States
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/sequence_state'
                required:
                - pagination
                - records
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /sequence_states/_search:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    post:
      operationId: searchSequenceStates
      summary: Search sequence states
      description: 'Search sequence states by contact_id and/or sequence_id. Note: only `read_from_cache=false` is supported at the moment.

        Support:


        | Provider  | Search By               |

        | --------- | ----------------------- |

        | Apollo    | contact_id only         |

        | Salesloft | contact_id, sequence_id |

        | Outreach  | contact_id, sequence_id |

        '
      tags:
      - Sequence States
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/include_raw_data'
      - $ref: '#/components/parameters/read_from_cache'
      - $ref: '#/components/parameters/remote_provider_page_size'
      - $ref: '#/components/parameters/cursor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: If both contact_id and sequence_id are provided, the search will be performed as an AND search.
                  properties:
                    contact_id:
                      type: string
                      description: The ID of the contact to filter on.
                    sequence_id:
                      type: string
                      description: The ID of the sequence to filter on.
              required:
              - filter
      responses:
        '200':
          description: Paginated Sequence States
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/sequence_state'
                required:
                - pagination
                - records
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /sequence_states/_batch:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    post:
      operationId: batchCreateSequenceState
      summary: Batch create sequence states
      description: 'Add multiple contacts to a sequence atomically. You must pass in the same sequenceId, userId and mailboxId for all the contact records.


        Support:


        | Provider  | Supported |

        | --------- | --------- |

        | Apollo    | Yes       |

        | Outreach  | No        |

        | Salesloft | No        |

        '
      tags:
      - Sequence States
      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  description: Will use the batch endpoints when possible (e.g. Apollo)
                  items:
                    $ref: '#/components/schemas/create_sequence_state'
              required:
              - records
      responses:
        '201':
          description: Sequence states created
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    description: Created records, in order passed in
                    items:
                      $ref: '#/components/schemas/created_record'
                  warnings:
                    $ref: '#/components/schemas/warnings'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /sequence_states/{sequence_state_id}:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    - $ref: '#/components/parameters/x-provider-name'
    - name: sequence_state_id
      in: path
      required: true
      schema:
        type: string
      example: ffb62704-addd-454e-bb86-ed0799703dc6
    get:
      operationId: getSequenceState
      summary: Get sequence state
      tags:
      - Sequence States
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/include_raw_data'
      responses:
        '200':
          description: Sequence State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sequence_state'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
components:
  schemas:
    warnings:
      type: array
      items:
        type: object
        properties:
          detail:
            type: string
          problem_type:
            type: string
          title:
            type: string
    create_sequence_state:
      type: object
      properties:
        contact_id:
          type: string
          example: c590dc63-8e43-48a4-8154-1fbb00ac936b
        mailbox_id:
          type: string
          example: 39fd1fe0-094b-4a61-b47f-3e3ac033203d
          description: The ID of the mailbox to use for the sequence. Required for Apollo and Outreach. Unused for Salesloft.
        sequence_id:
          type: string
          example: b854e510-1c40-4ef6-ade4-8eb35f49d331
        user_id:
          type: string
          description: The ID of the user who is performing the action. Required for Salesloft, optional for Apollo, unused for Outreach.
      required:
      - contact_id
      - sequence_id
    created_record:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    sequence_state:
      type: object
      properties:
        id:
          type: string
          example: 54312
        state:
          type: string
          nullable: true
          example: active
        contact_id:
          type: string
          nullable: true
          example: c590dc63-8e43-48a4-8154-1fbb00ac936b
        mailbox_id:
          nullable: true
          type: string
          example: 39fd1fe0-094b-4a61-b47f-3e3ac033203d
        user_id:
          nullable: true
          type: string
          example: ab0530ef-61dd-4a99-b26b-6b5a61c7c62e
        sequence_id:
          nullable: true
          type: string
          example: b854e510-1c40-4ef6-ade4-8eb35f49d331
        created_at:
          type: string
          nullable: true
          format: date-time
          example: '2022-02-27T00:00:00Z'
        updated_at:
          type: string
          nullable: true
          format: date-time
          example: '2022-02-27T00:00:00Z'
        is_deleted:
          type: boolean
          example: false
        last_modified_at:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
      required:
      - id
      - state
      - mailbox_id
      - user_id
      - contact_id
      - sequence_id
      - created_at
      - updated_at
      - is_deleted
      - last_modified_at
    errors:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier for the instance of the error. Provide this to support when contacting Supaglue.
            example: 9366efb4-8fb1-4a28-bfb0-8d6f9cc6b5c5
          detail:
            type: string
            description: A detailed description of the error.
            example: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
          problem_type:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
            deprecated: true
          title:
            type: string
            description: A brief description of the error. The schema and type of message will vary by Provider.
            example: 'Property values were not valid

              '
          code:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
          status:
            type: string
            description: The HTTP status code associated with the error.
            example: '400'
          meta:
            type: object
            description: Additional metadata about the error.
            properties:
              cause:
                type: object
                description: The cause of the error. Usually the underlying error from the remote Provider.
                example:
                  code: 400
                  body:
                    status: error
                    message: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
                    correlationId: ac94252c-90b5-45d2-ad1d-9a9f7651d7d2
