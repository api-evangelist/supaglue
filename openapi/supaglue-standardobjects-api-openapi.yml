    standard_object_record:
      type: object
      properties:
        id:
          type: string
        object_name:
          type: string
        data:
          type: object
          additionalProperties: true
        is_deleted:
          type: boolean
        last_modified_at:
          type: string
          format: date-time
      required:
      - id
      - object_name
      - data
      - is_deleted
      - last_modified_at
      example:
        id: 001Fn00023f8oYYIA0
        object_name: Account
        data:
          Name: Acme Corp
          Description: We create the best embedded integration platforms.
        is_deleted: false
        last_modified_at: '2021-01-01T00:00:00Z'
