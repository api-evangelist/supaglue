    salesforce_account:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier for this account.
        Description:
          type:
          - string
          - 'null'
          description: A description of the contact.
        BillingCity:
          type:
          - string
          - 'null'
          description: The city of the billing address of this contact.
        BillingCountry:
          type:
          - string
          - 'null'
          description: The country of the billing address of this contact.
        BillingPostalCode:
          type:
          - string
          - 'null'
          description: The postal code of the billing address of this contact.
        BillingState:
          type:
          - string
          - 'null'
          description: The state of the billing address of this contact.
        BillingStreet:
          type:
          - string
          - 'null'
          description: The street of the billing address of this contact.
        ShippingCity:
          type:
          - string
          - 'null'
          description: The city of the shipping address of this contact.
        ShippingCountry:
          type:
          - string
          - 'null'
          description: The country of the shipping address of this contact.
        ShippingPostalCode:
          type:
          - string
          - 'null'
          description: The postal code of the shipping address of this contact.
        ShippingState:
          type:
          - string
          - 'null'
          description: The state of the shipping address of this contact.
        ShippingStreet:
          type:
          - string
          - 'null'
          description: The street of the shipping address of this contact.
        Phone:
          type:
          - string
          - 'null'
          description: The account's phone number.
        Fax:
          type:
          - string
          - 'null'
          description: The account's fax number.
        Industry:
          type:
          - string
          - 'null'
          description: The type of industry in which the account operates.
        LastActivityDate:
          type:
          - string
          - 'null'
          example: '2022-02-27T00:00:00Z'
          format: date-time
          description: The date of the last activity on an account. The LastActivityDate is set to whichever is more recent -- the LastActivityDate of a related task or event or the LastModifiedDate of an account's record.
        Name:
          type:
          - string
          - 'null'
          description: The name of the account. Maximum size is 255 characters.
        NumberOfEmployees:
          type:
          - integer
          - 'null'
          description: The number of employees that work at the account.
        OwnerId:
          type:
          - string
          - 'null'
          description: ID of the user who owns this account. This is a relationship field.
        Website:
          type:
          - string
          - 'null'
          description: The account's website URL.
        IsDeleted:
          type: boolean
          description: Indicates whether the object has been moved to the Recycle Bin (true) or not (false).
        CreatedDate:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
          description: The date and time when this contact was created.
        SystemModstamp:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
          description: The date and time when this contact was last modified.
        raw_data:
          type: object
          description: The raw data returned by the provider.
          additionalProperties: true
      required:
      - Id
      - Description
      - OwnerId
      - BillingCity
      - BillingCountry
      - BillingPostalCode
      - BillingState
      - BillingStreet
      - ShippingCity
      - ShippingCountry
      - ShippingPostalCode
      - ShippingState
      - ShippingStreet
      - Phone
      - Fax
      - Industry
      - LastActivityDate
      - Name
      - NumberOfEmployees
      - Website
      - IsDeleted
      - CreatedDate
      - SystemModstamp
      - raw_data
    pagination:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjQyNTc5ZjczLTg1MjQtNDU3MC05YjY3LWVjYmQ3MDJjNmIxNCIsInJldmVyc2UiOmZhbHNlfQ==
        previous:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjBjZDhmYmZkLWU5NmQtNDEwZC05ZjQxLWIwMjU1YjdmNGI4NyIsInJldmVyc2UiOnRydWV9
        total_count:
          type: number
          example: 100
      required:
      - next
      - previous
  parameters:
    page_size:
      name: page_size
      in: query
      schema:
        type: string
      example: 123
      description: 'Number of results to return per page. (Max: 1000)'
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
      description: The pagination cursor value
    modified_after:
      name: modified_after
      in: query
      schema:
        type: string
        format: date-time
      description: If provided, will only return objects modified after this datetime. Datetime must be in ISO 8601 format and URI encoded.
      example: '2023-02-23T00:00:00Z'
    x-customer-id:
      name: x-customer-id
      in: header
      schema:
        type: string
      example: my-customer-1
      description: The customer ID that uniquely identifies the customer in your application
      required: true
  responses:
    remoteProviderError:
      description: Remote provider error
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    notImplemented:
      description: Not implemented
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    badRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    notFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
    internalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                $ref: '#/components/schemas/errors'
  securitySchemes:
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header
      description: API key to allow developers to access the API
