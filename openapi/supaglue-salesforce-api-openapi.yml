openapi: 3.2.0
info:
  version: 0.13.13
  title: Data Listing Salesforce API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: '#### Introduction


    Welcome to the Provider API documentation for Data Listing. You can use this API to list standard and custom objects to sync them from Supaglue to your database.


    :::info

    **NOTE**: To use the Data Listing API you need to use the Supaglue Managed Destination and select [Standard Objects](https://docs.supaglue.com/next/platform/objects/overview#configuration) to be synced.

    :::


    [![Run in Postman](https://run.pstmn.io/button.svg)](https://www.postman.com/supaglue/workspace/supaglue-public/overview)


    #### Base API URL

    ```

    https://api.supaglue.io/data/v2

    ```

    '
servers:
- url: https://api.supaglue.io/data/v2
  description: Supaglue API
tags:
- name: Salesforce
  description: Salesforce is a CRM Provider.
paths:
  /salesforce/contacts:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    get:
      operationId: listSalesforceContacts
      summary: List contacts
      description: '**NOTE**: To use the Data Listing API you need to use the Supaglue Managed Destination and select [Standard Objects](https://docs.supaglue.com/next/platform/objects/overview#configuration) to be synced.

        '
      tags:
      - Salesforce
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/salesforce_contact'
                required:
                - pagination
                - records
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
  /salesforce/accounts:
    parameters:
    - $ref: '#/components/parameters/x-customer-id'
    get:
      operationId: listSalesforceAccounts
      summary: List accounts
      description: '**NOTE**: To use the Data Listing API you need to use the Supaglue Managed Destination and select [Standard Objects](https://docs.supaglue.com/next/platform/objects/overview#configuration) to be synced.

        '
      tags:
      - Salesforce
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/modified_after'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/salesforce_account'
                required:
                - pagination
                - records
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '499':
          $ref: '#/components/responses/remoteProviderError'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
components:
  schemas:
    salesforce_contact:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier for this contact.
        Description:
          type:
          - string
          - 'null'
          description: A description of the contact.
        Email:
          type:
          - string
          - 'null'
          description: The contact's email address.
        AccountId:
          type:
          - string
          - 'null'
          description: ID of the account that's the parent of this contact. This is a relationship field.
        FirstName:
          type:
          - string
          - 'null'
          description: The contact's first name up to 40 characters.
        HomePhone:
          type:
          - string
          - 'null'
          description: The contact's home phone number.
        IsDeleted:
          type: boolean
          description: Indicates whether the object has been moved to the Recycle Bin (true) or not (false).
        LastActivityDate:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
          description: The date of the last activity on a contact. The LastActivityDate is set to whichever is more recent -- the LastActivityDate of a related task or event or the LastModifiedDate of a contact's record.
        LastName:
          type:
          - string
          - 'null'
          description: The contact's last name. Maximum size is 80 characters.
        LeadSource:
          type:
          - string
          - 'null'
          description: The source of the lead.
        MailingCity:
          type:
          - string
          - 'null'
          description: The city of the mailing address of this contact.
        MailingCountry:
          type:
          - string
          - 'null'
          description: The country of the mailing address of this contact.
        MailingPostalCode:
          type:
          - string
          - 'null'
          description: The postal code of the mailing address of this contact.
        MailingState:
          type:
          - string
          - 'null'
          description: The state of the mailijng address of this contact.
        MailingStreet:
          type:
          - string
          - 'null'
          description: The street of the mailing address of this contact.
        MobilePhone:
          type:
          - string
          - 'null'
          description: The contact's mobile phone number.
        OwnerId:
          type:
          - string
          - 'null'
          description: ID of the user who owns this contact. This is a relationship field.
        Phone:
          type:
          - string
          - 'null'
          description: The contact's phone number.
        Fax:
          type:
          - string
          - 'null'
          description: The contact's fax number.
        Title:
          type:
          - string
          - 'null'
          description: The contact's title.
        CreatedDate:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
          description: The date and time when this contact was created.
        SystemModstamp:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
          description: The date and time when this contact was last modified.
        raw_data:
          type: object
          description: The raw data returned by the provider.
          additionalProperties: true
      required:
      - Id
      - Description
      - Email
      - AccountId
      - FirstName
      - HomePhone
      - IsDeleted
      - LastActivityDate
      - LastName
      - LeadSource
      - MailingCity
      - MailingCountry
      - MailingPostalCode
      - MailingState
      - MailingStreet
      - MobilePhone
      - OwnerId
      - Phone
      - Fax
      - Title
      - CreatedDate
      - SystemModstamp
      - raw_data
    errors:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier for the instance of the error. Provide this to support when contacting Supaglue.
            example: 9366efb4-8fb1-4a28-bfb0-8d6f9cc6b5c5
          detail:
            type: string
            description: A detailed description of the error.
            example: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
          problem_type:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
            deprecated: true
          title:
            type: string
            description: A brief description of the error. The schema and type of message will vary by Provider.
            example: 'Property values were not valid

              '
          code:
            type: string
            description: The Supaglue error code associated with the error.
            example: MISSING_REQUIRED_FIELD
          status:
            type: string
            description: The HTTP status code associated with the error.
            example: '400'
          meta:
            type: object
            description: Additional metadata about the error.
            properties:
              cause:
                type: object
                description: The cause of the error. Usually the underlying error from the remote Provider.
                example:
                  code: 400
                  body:
                    status: error
                    message: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
