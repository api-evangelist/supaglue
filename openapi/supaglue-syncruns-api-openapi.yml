    pagination:
      type: object
      properties:
        next:
          type: string
          nullable: true
          example: eyJpZCI6IjQyNTc5ZjczLTg1MjQtNDU3MC05YjY3LWVjYmQ3MDJjNmIxNCIsInJldmVyc2UiOmZhbHNlfQ==
        previous:
          type: string
          nullable: true
          example: eyJpZCI6IjBjZDhmYmZkLWU5NmQtNDEwZC05ZjQxLWIwMjU1YjdmNGI4NyIsInJldmVyc2UiOnRydWV9
        total_count:
          type: number
          example: 100
      required:
      - next
      - previous
    sync_run:
      oneOf:
      - type: object
        title: 'Data model: Objects'
        properties:
          id:
            type: string
            example: 20eb4da3-6b38-4ec6-a82d-ecee59a9d6d9
          sync_id:
            type: string
            example: 629525f8-f6f7-436c-80fa-1cb23acc5bf8
          object_type:
            type: string
            enum:
            - common
            - standard
            - custom
          object:
            type: string
          error_message:
            type: string
            nullable: true
          start_timestamp:
            type: string
            example: '2023-02-22T19:55:17.559537Z'
          end_timestamp:
            type: string
            nullable: true
            example: '2023-02-22T20:55:17.559537Z'
          application_id:
            type: string
            example: 974125fa-ffb6-47fc-b12f-44c566fc5da1
          customer_id:
            type: string
            example: my-customer-1
          provider_name:
            $ref: '#/components/schemas/provider_name'
          category:
            $ref: '#/components/schemas/category'
          connection_id:
            type: string
            example: 3217ea51-11c8-43c9-9547-6f197e02e5e4
          status:
            type: string
            enum:
            - SUCCESS
            - IN_PROGRESS
            - FAILURE
          num_records_synced:
            type: number
            nullable: true
            example: 100
