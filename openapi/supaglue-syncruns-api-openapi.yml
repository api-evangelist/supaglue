openapi: 3.0.3
info:
  version: 0.25.7
  title: Unified CRM Accounts SyncRuns API
  contact:
    name: Supaglue
    email: docs@supaglue.com
    url: https://supaglue.com
  description: '#### Introduction


    Welcome to the Unified API (CRM) documentation. You can use this API to write to multiple third-party providers within the CRM category.


    [View common schema for CRM](https://docs.supaglue.com/platform/common-schemas/crm)


    #### Base API URL

    ```

    https://api.supaglue.io/crm/v2

    ```

    '
servers:
- url: https://api.supaglue.io/crm/v2
  description: Supaglue API
tags:
- name: SyncRuns
  description: A `SyncRun` is a single execution of a Sync at a point in time.
paths:
  /sync-runs:
    get:
      operationId: getSyncRuns
      tags:
      - SyncRuns
      security:
      - x-api-key: []
      summary: Get SyncRuns
      description: Get a list of SyncRuns.
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        description: The pagination cursor value
      - name: page_size
        in: query
        schema:
          type: string
        example: '100'
        description: Number of results to return per page
      - name: customer_id
        in: query
        schema:
          type: string
        example: my-customer-1
        description: The customer ID that uniquely identifies the customer in your application
      - name: provider_name
        in: query
        schema:
          type: string
        example: salesforce
        description: The provider name
      - name: object_type
        in: query
        schema:
          type: string
          enum:
          - common
          - standard
          - custom
        example: standard
      - name: object
        in: query
        schema:
          type: string
        example: account
        description: The object to filter by
      - name: entity_id
        deprecated: true
        in: query
        schema:
          type: string
        example: e74b5a4f-f252-4a6c-940c-f35873498543
        description: The entity id to filter by
      - name: status
        in: query
        schema:
          type: string
        example: SUCCESS
        description: The status to filter by (case-insensitive)
      - name: start_timestamp
        in: query
        schema:
          type: string
        example: '>2021-01-06T03:24:53.434326Z'
        description: The start time to filter by. Should start with one of [`>`, `<`] followed by an ISO 8601 timestamp.
      - name: end_timestamp
        in: query
        schema:
          type: string
        example: '>2021-01-06T03:24:53.434326Z'
        description: The end time to filter by. Should start with [`>`, `<`] followed by an ISO 8601 timestamp.
      responses:
        '200':
          description: SyncRun
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/pagination'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/sync_run'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'
        '501':
          $ref: '#/components/responses/notImplemented'
