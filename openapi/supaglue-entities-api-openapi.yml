    entity:
      type: object
      deprecated: true
      properties:
        id:
          type: string
          example: 649b1e49-2722-46a3-a7e7-10caae78a43f
        application_id:
          type: string
          example: d8ceb3ff-8b7f-4fa7-b8de-849292f6ca69
