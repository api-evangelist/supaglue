                    x-trace: 2B1B4386362759B6A4C34802AD168B803DDC1BE770000000000000000000
              origin:
                type: string
                enum:
                - remote-provider
                - supaglue
                description: The origin of the error.
                example: remote-provider
              application_name:
                type: string
                description: The name of the application that generated the error.
                example: MyCompany Production
            required:
            - origin
            additionalProperties: true
        required:
        - id
        - detail
        - problem_type
        - title
        - code
        - status
        - meta
        example:
        - meta:
            cause:
              code: 400
              body:
                status: error
                message: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
                correlationId: ac94252c-90b5-45d2-ad1d-9a9f7651d7d2
                category: VALIDATION_ERROR
              headers:
                access-control-allow-credentials: 'false'
                cf-cache-status: DYNAMIC
                cf-ray: 8053d17b9dae9664-SJC
                connection: close
                content-length: '361'
                content-type: application/json;charset=utf-8
                date: Mon, 11 Sep 2023 23:51:22 GMT
                nel: '{"success_fraction":0.01,"report_to":"cf-nel","max_age":604800}'
                report-to: '{"endpoints":[{"url":"https://a.nel.cloudflare.com/report/v3?s=FgwuXObO%2Fz6ahUJKsxjDLaXTWjooJ8tB0w4%2B%2BKaulGStx0FGkn1PoJoOx2KrFMfihzNdfAqikq7CmgbdlmwKB8hkmp3eTb68qpg10LXFlRgiSqRhbWM7yYSfo8CXmPBc"}],"group":"cf-nel","max_age":604800}'
                server: cloudflare
                strict-transport-security: max-age=31536000; includeSubDomains; preload
                vary: origin, Accept-Encoding
                x-content-type-options: nosniff
                x-envoy-upstream-service-time: '91'
                x-evy-trace-listener: listener_https
                x-evy-trace-route-configuration: listener_https/all
                x-evy-trace-route-service-name: envoyset-translator
                x-evy-trace-served-by-pod: iad02/hubapi-td/envoy-proxy-6c94986c56-9xsh2
                x-evy-trace-virtual-host: all
                x-hubspot-correlation-id: ac94252c-90b5-45d2-ad1d-9a9f7651d7d2
                x-hubspot-ratelimit-interval-milliseconds: '10000'
                x-hubspot-ratelimit-max: '100'
                x-hubspot-ratelimit-remaining: '99'
                x-hubspot-ratelimit-secondly: '10'
                x-hubspot-ratelimit-secondly-remaining: '9'
                x-request-id: ac94252c-90b5-45d2-ad1d-9a9f7651d7d2
                x-trace: 2B1B4386362759B6A4C34802AD168B803DDC1BE770000000000000000000
          detail: 'Property values were not valid: [{"isValid":false,"message":"Property \"__about_us\" does not exist","error":"PROPERTY_DOESNT_EXIST","name":"__about_us","localizedErrorMessage":"Property \"__about_us\" does not exist"}]'
          problem_type: MISSING_REQUIRED_FIELD
          title: 'Property values were not valid

            '
          code: MISSING_REQUIRED_FIELD
          status: '400'
          id: 9366efb4-8fb1-4a28-bfb0-8d6f9cc6b5c5
    update_sequence_step:
      type: object
      properties:
        template:
          description: The email/message template to be used for this step. Only applicable for email or message steps.
          type: object
          properties:
            body:
              type: string
              description: The body of the email (HTML).
            subject:
              type: string
              description: The subject of the email.
        custom_fields:
          $ref: '#/components/schemas/custom_fields'
    warnings:
      type: array
      items:
        type: object
        properties:
          detail:
            type: string
          problem_type:
            type: string
          title:
            type: string
    sequence:
      type: object
      properties:
        owner_id:
          type:
          - string
          - 'null'
          example: 95fe0d29-e8cc-48ac-9afd-e02d8037a597
        id:
          type: string
          example: 54312
        is_enabled:
          type: boolean
          example: true
        name:
          type:
          - string
          - 'null'
        tags:
          type: array
          description: Raw values in Outreach, ids in Apollo, and not supported in Salesloft
          items:
            type: string
        num_steps:
          type: number
        metrics:
          type: object
          additionalProperties: true
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-02-27T00:00:00Z'
        last_modified_at:
          type: string
          format: date-time
          example: '2022-02-27T00:00:00Z'
        is_archived:
          type: boolean
          description: When archived, cannot add contact to sequence or send mail.
        share_type:
          type: string
          description: The share type of the sequence. If `team` will share with the whole team. `private` will only share with the owner.
          enum:
          - team
          - private
        steps:
          type: array
          items:
            $ref: '#/components/schemas/sequence_step'
          description: Only returned when getting single sequence, not returned when listing sequences because it is too expensive to do so.
      required:
      - id
      - is_enabled
      - name
      - tags
      - num_steps
      - metrics
      - created_at
      - updated_at
      - last_modified_at
    create_sequence:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          description: Raw values in Outreach, ids in Apollo, and not supported in Salesloft
          items:
            type: string
        type:
          type: string
          description: The share type of the sequence. Setting to `team` will share with the whole team. `private` will only share with the owner.
          enum:
          - team
          - private
        owner_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/create_sequence_step'
        custom_fields:
          $ref: '#/components/schemas/custom_fields'
      required:
      - name
      - type
    create_sequence_step:
      type: object
      properties:
        name:
          type: string
          description: The name given by the user for the step. Used by Salesloft only.
        interval_seconds:
          type: number
          description: The interval (in seconds) until this step will activate after the previous step (in case of first step, relative to when prospect first enters a sequence); only applicable to interval-based sequences. This is 0 by default
        date:
          type: string
          example: '2023-01-01'
          description: The date this step will activate; only applicable to date-based sequences.
        template:
          description: The email/message template to be used for this step. Only applicable for email or message steps.
          oneOf:
          - type: object
            properties:
              id:
                type: string
                description: The ID of the template to use for this step.
            required:
            - id
          - type: object
            properties:
              body:
                type: string
                description: The body of the email (HTML).
              subject:
                type: string
                description: The subject of the email.
              name:
                type: string
                description: The name of the template. In Outreach, if missing this will create an `invisible` template that doesn't show up in the templates list UI.
              to:
                type: array
                description: A list of default person and email address pairs to receive this template in the "to" field
                items:
                  type: string
              cc:
                type: array
                description: A list of default person and email address pairs to receive this template in the "cc" field
                items:
                  type: string
              bcc:
                type: array
                description: A list of default person and email address pairs to receive this template in the "bcc" field
                items:
                  type: string
              custom_fields:
                $ref: '#/components/schemas/custom_fields'
            required:
            - body
            - subject
        is_reply:
          type: boolean
          description: If true, this step will be sent as a reply to the previous step.
        order:
          type: number
          description: The step's display order within its sequence. Only applicable for Outreach when adding steps one at a time after the initial sequence creation, otherwise when creating steps together with sequence order is implicit based on the order of step within the step array. Salesloft does not use the `order` param, and order is instead determined by `interval_seconds` which translates into the `day` parameter
        type:
          type: string
          enum:
          - auto_email
          - manual_email
          - call
          - task
          - linkedin_send_message
          description: "The type of the sequence state. Note: `linkedin_send_message` is undocumented in Outreach and subject to change.\n\nSee below for how these types are mapped:\n\n<table>\n  <thead>\n      <tr>\n          <th>Provider</th>\n          <th>auto_email</th>\n          <th>manual_email</th>\n          <th>call</th>\n          <th>task</th>\n          <th>linkedin_send_message</th>\n      </tr>\n  </thead>\n  <tbody>\n      <tr>\n          <td>Apollo</td>\n          <td>auto_email</td>\n          <td>manual_email</td>\n          <td>call</td>\n          <td>action_item</td>\n          <td>linkedin_send_message</td>\n      </tr>\n      <tr>\n          <td>Outreach</td>\n          <td>auto_email</td>\n          <td>manual_email</td>\n          <td>call</td>\n          <td>task</td>\n          <td>linkedin_send_message</td>\n      </tr>\n      <tr>\n          <td>Salesloft</td>\n          <td>Email</td>\n          <td>Email</td>\n          <td>Phone</td>\n          <td>Other</td>\n          <td>(Not supported)</td>\n      </tr>\n  </tbody>\n</table>\n"
        task_note:
          type: string
          description: An optional note to be attached to this step.
        custom_fields:
          $ref: '#/components/schemas/custom_fields'
      required:
      - type
    pagination:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjQyNTc5ZjczLTg1MjQtNDU3MC05YjY3LWVjYmQ3MDJjNmIxNCIsInJldmVyc2UiOmZhbHNlfQ==
        previous:
          type:
          - string
          - 'null'
          example: eyJpZCI6IjBjZDhmYmZkLWU5NmQtNDEwZC05ZjQxLWIwMjU1YjdmNGI4NyIsInJldmVyc2UiOnRydWV9
        total_count:
          type: number
          example: 100
      required:
      - next
      - previous
    custom_fields:
      type: object
      additionalProperties: true
      description: Custom properties to be inserted that are not covered by the common object. Object keys must match exactly to the corresponding provider API.
    created_record:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    sequence_step:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The name given by the user for the step. Used by Salesloft only.
        interval_seconds:
          type: number
          description: The interval (in seconds) until this step will activate after the previous step (in case of first step, relative to when prospect first enters a sequence); only applicable to interval-based sequences. This is 0 by default
        date:
          type: string
          example: '2023-01-01'
          description: The date this step will activate; only applicable to date-based sequences.
        template:
          description: The email/message template to be used for this step. Only applicable for email or message steps.
          type: object
          properties:
            id:
              type: string
              description: The ID of the template
            body:
              type: string
              description: The body of the email (HTML).
            subject:
              type: string
              description: The subject of the email.
            name:
              type: string
              description: The name of the template. In Outreach, if missing this will create an `invisible` template that doesn't show up in the templates list UI.
            to:
              type: array
              description: A list of default person and email address pairs to receive this template in the "to" field
              items:
                type: string
            cc:
              type: array
              description: A list of default person and email address pairs to receive this template in the "cc" field
              items:
                type: string
            bcc:
              type: array
              description: A list of default person and email address pairs to receive this template in the "bcc" field
              items:
                type: string
          required:
          - body
          - subject
        is_reply:
          type: boolean
          description: If true, this step will be sent as a reply to the previous step.
        order:
          type: number
          description: The step's display order within its sequence. Only applicable for Outreach when adding steps one at a time after the initial sequence creation, otherwise when creating steps together with sequence order is implicit based on the order of step within the step array. Salesloft does not use the `order` param, and order is instead determined by `interval_seconds` which translates into the `day` parameter
        type:
          type: string
          enum:
          - auto_email
          - manual_email
          - call
          - task
          - linkedin_send_message
          description: "The type of the sequence state. Note: `linkedin_send_message` is undocumented in Outreach and subject to change.\n\nSee below for how these types are mapped:\n\n<table>\n  <thead>\n      <tr>\n          <th>Provider</th>\n          <th>auto_email</th>\n          <th>manual_email</th>\n          <th>call</th>\n          <th>task</th>\n          <th>linkedin_send_message</th>\n      </tr>\n  </thead>\n  <tbody>\n      <tr>\n          <td>Apollo</td>\n          <td>auto_email</td>\n          <td>manual_email</td>\n          <td>call</td>\n          <td>action_item</td>\n          <td>linkedin_send_message</td>\n      </tr>\n      <tr>\n          <td>Outreach</td>\n          <td>auto_email</td>\n          <td>manual_email</td>\n          <td>call</td>\n          <td>task</td>\n          <td>linkedin_send_message</td>\n      </tr>\n      <tr>\n          <td>Salesloft</td>\n          <td>Email</td>\n          <td>Email</td>\n          <td>Phone</td>\n          <td>Other</td>\n          <td>(Not supported)</td>\n      </tr>\n  </tbody>\n</table>\n"
        task_note:
          type: string
          description: An optional note to be attached to this step.
      required:
      - type
  securitySchemes:
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header
      description: API key to allow developers to access the API
