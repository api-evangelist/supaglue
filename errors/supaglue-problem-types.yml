    description: Brief description; schema and wording vary by third-party Provider.
  - name: code
    description: Supaglue error code, e.g. MISSING_REQUIRED_FIELD.
  - name: problem_type
    description: Deprecated alias of code.
    deprecated: true
  - name: status
    description: HTTP status code as a string.
  - name: meta
    description: 'Additional metadata: cause, origin, application_name.'
