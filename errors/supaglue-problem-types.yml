note: Supaglue does NOT use RFC 9457 application/problem+json. Every error response is application/json
  carrying a top-level `errors` ARRAY; each element has id, detail, title, code, status and meta (with
  cause/origin/application_name). The `problem_type` field is marked deprecated in the spec in favour
  of `code`. Status 499 is a Supaglue invention used to pass a remote provider's error through unchanged
  — agents must treat 499 as 'the upstream SaaS rejected this', not as a Supaglue fault.
