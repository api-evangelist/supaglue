  path is a raw HTTPS call carrying `x-api-key` — and no package under a supaglue npm scope exists
  (@supaglue/* is entirely unpublished; pypi.org/project/supaglue is a 404). What the npm registry
  does hold is four third-party or throwaway packages, all last published in 2023–2024 and all
  abandoned, listed below because a consumer searching "supaglue" will find them and needs to know
  what they are. None is marked official, so NO `SDKs` pointer is emitted for this provider.
  The one artifact that IS first-party and installable is the self-hosted server itself: the
  MIT-licensed monorepo and its Helm chart, which is a deployment, not a client library.
