status: retired
note: >-
  Supaglue is over. The GitHub repository was archived by the owner on 10 March 2024 and is
  read-only; the last commit landed 15 February 2024. The hosted product's hosts no longer exist —
  api.supaglue.io and app.supaglue.io do not resolve — and supaglue.com now redirects to a
  HugeDomains listing offering the domain for sale, so the vendor no longer controls its own
  namespace. The MIT-licensed code can still be self-hosted from the archive; nothing else survives.
  There is no deprecation policy, no Sunset/Deprecation header support and no status page: the
  service did not wind down through a published lifecycle, it simply stopped.
