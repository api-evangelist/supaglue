aid: supaglue
name: Supaglue
description: 'Supaglue was an open-source unified API platform for B2B SaaS product integrations: a single contract
  for CRM, engagement, ticketing, enrichment and marketing-automation objects projected across 30+ third-party providers
  (Salesforce, HubSpot, Pipedrive, Outreach, Salesloft, Zendesk, Apollo and more), plus managed OAuth to those providers,
  managed syncs into the customer''s own warehouse (Postgres, BigQuery, Snowflake, Redshift, S3), a passthrough
  escape hatch to native provider APIs, and a Management API to configure customers, connections, schemas, entities
  and sync schedules. Nine first-party OpenAPI documents (v2, x-api-key auth) and nine typed webhook events were
  published. THE SERVICE IS RETIRED: the GitHub repository (github.com/supaglue-labs) was archived by its owner
  on 2024-03-10, api.supaglue.io and app.supaglue.io no longer resolve, and supaglue.com now redirects to a HugeDomains
  sale listing. The MIT-licensed code remains self-hostable, and the contract is preserved here as the historical
  record of a well-shaped unified API.'
