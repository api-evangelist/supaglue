aid: supaglue
name: Supaglue
description: >-
  Supaglue is an open-source unified API platform that enables B2B SaaS developers to build product integrations with
  CRM, HRIS, sales engagement, ticketing, and other business applications. It provides a unified API layer that
  abstracts away provider-specific differences, managed OAuth authentication, data syncing to data warehouses (BigQuery,
  Snowflake, Redshift, Postgres), and a management API for configuring customers, connections, and sync configurations.
  Supported providers include Salesforce, HubSpot, Pipedrive, Zendesk, Slack, and 15+ others. The platform is available
  as a managed cloud service (api.supaglue.io) and as a self-hosted open-source deployment. The GitHub organization is
  github.com/supaglue-labs.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/supaglue.png
tags:
  - CRM
  - HRIS
  - Unified API
  - Open Source
  - Integrations
  - Sales Engagement
