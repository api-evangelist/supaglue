specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Supaglue
providerId: supaglue
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - CRM
  - Unified API
  - Open Source
  - Rate Limiting
description: Supaglue is an archived open-source project (MIT). The hosted product is shut down so there
  is no vendor-published rate-limits document. When self-hosted, request throttling is set by the deployer;
  upstream CRM rate limits (Salesforce, HubSpot, Pipedrive, etc.) flow through unchanged.
sources:
  - https://github.com/supaglue-labs/supaglue
notes: 'Reconciliation marked false: project archived 2024-03-10. No hosted service to reconcile against.
  Self-hosters define their own throttling.'
responseCodes:
  throttled: 429
limits:
  - name: Self-Hosted Deployment Limits
    scope: deployment
    metric: varies
    limit: defined by the self-hoster's deployment configuration
    notes: Upstream provider limits (Salesforce, HubSpot, Pipedrive) pass through and are governed by
      the underlying CRM, not Supaglue.
policies:
  - name: Pass-Through Throttling
    description: Supaglue forwards requests to upstream CRM APIs; the effective rate limit is the smaller
      of the deployer's local cap and the upstream provider's limit.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
